version : 2
models:
  - name: bronze_customer #  Must match the filename of a model -- including case sensitivity.
    config:
        materialized: view
        schema: bronze
  - name: bronze_product
    config:
        materialized: view
        schema: bronze
  - name: bronze_sales
    columns:
      - name: sales_id
        data_tests:
          - not_null
          - unique
      - name: gross_amount
        data_tests:
          - custom_generic_non_negative:
              description: "Gross amount should be non-negative with a custom test"
  - name: bronze_store
    columns:
      - name: store_sk
        data_tests:
          - not_null
          - unique
      - name: store_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose','MegaMart Toronto']
              config:
                severity: warn
            
    